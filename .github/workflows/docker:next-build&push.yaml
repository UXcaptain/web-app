name: Push to Docker Hub, build and deploy :next tag image to Docker Hub

on:
    pull_request:
        branches: [ "next" ]

jobs:
    docker-build-and-push:
        runs-on: ubuntu-latest
        steps:
        -
            name: Checkout
            uses: actions/checkout@v4
        -
            name: Login to Docker Hub
            uses: docker/login-action@v3
            with:
                username: "${{ secrets.DOCKERHUB_USERNAME }}"
                password: "${{ secrets.DOCKERHUB_TOKEN }}"
        -
            name: Set up QEMU
            uses: docker/setup-qemu-action@v3
        -
            name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v3
        -
            name: Build and push
            uses: docker/build-push-action@v6
            with:
                context: .
                platforms: linux/amd64,linux/arm64
                push: true
                tags: sergion14/uxcaptain:front-next
                # no-cache: true

    koyeb-deploy:
        runs-on: ubuntu-latest
        environment: next
        needs: docker-build-and-push
        concurrency: 
            group: "${{ github.ref_name }}"
            cancel-in-progress: true
        steps:
            -
                name: Install and configure the Koyeb CLI
                uses: koyeb-community/koyeb-actions@v2
                with:
                    api_token: "${{ secrets.KOYEB_API_TOKEN }}"
            # - No need for secrets on current implementation
            #     name: Create VITE_API_BASE_URL secret
            #     uses: koyeb/action-git-deploy/secret@v1
            #     with:
            #         secret-name: NEXT_VITE_API_BASE_URL
            #         secret-value: "${{ secrets.POSTHOG_API_KEY }}"
            # - 
            #     name: Create VITE_PUBLIC_POSTHOG_KEY secret
            #     uses: koyeb/action-git-deploy/secret@v1
            #     with:
            #         secret-name: NEXT_VITE_PUBLIC_POSTHOG_KEY
            #         secret-value: "${{ secrets.POSTHOG_API_KEY }}"
            -
                name: Build and deploy the application to Koyeb
                uses: koyeb/action-git-deploy@v1
                with:
                    service-env: VITE_PUBLIC_POSTHOG_KEY="${{ vars.VITE_PUBLIC_POSTHOG_KEY }}",VITE_API_BASE_URL="${{ vars.VITE_API_BASE_URL }}"
                    app-name: "webapp-next"
                    service-instance-type: "eco-nano" #https://www.koyeb.com/docs/reference/instances
                    service-name: "webapp-next"
                    service-ports: "80:http"
                    service-routes: "/:80"
                    service-regions: "fra" # https://www.koyeb.com/docs/reference/regions
                    docker: "sergion14/uxcaptain:front-next"
                    docker-private-registry-secret: "SNR" # MANAGED in https://app.koyeb.com/settings/registry-configuration
                