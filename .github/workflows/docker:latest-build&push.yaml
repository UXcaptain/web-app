name: Push to Docker Hub, build and deploy :next tag image to Docker Hub

on:
    push:
        branches: [ "latest" ]

jobs:
    docker-build-and-push:
        runs-on: ubuntu-latest
        environment: latest
        steps:
        -
            name: Checkout
            uses: actions/checkout@v4
        -
            name: Login to Docker Hub
            uses: docker/login-action@v3
            with:
                username: "${{ secrets.DOCKERHUB_USERNAME }}"
                password: "${{ secrets.DOCKERHUB_TOKEN }}"
        -
            name: Set up QEMU
            uses: docker/setup-qemu-action@v3
        -
            name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v3
        -
            name: Build and push
            uses: docker/build-push-action@v6
            with:
                context: .
                platforms: linux/amd64 #,linux/arm64 - Not building for ARM, since ubuntu server is just amd64
                push: true
                tags: sergion14/uxcaptain:webapp-latest
                build-args: |
                    VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
                    VITE_PUBLIC_POSTHOG_KEY=${{ vars.VITE_PUBLIC_POSTHOG_KEY }}
                    VITE_SITE_BASE_URL=${{ VARS.VITE_SITE_BASE_URL }}